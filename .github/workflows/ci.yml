name: Public application checks
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca
        with:
          version: "0.12.23"
      - run: uv python install 3.12
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: node --check public/app.js
      - run: uv run --frozen pytest -q
      # ubuntu-24.04 already supplies Chromium's shared libraries. Installing
      # extra font packs via apt stalled the prior run for its entire 10-minute
      # budget. Install the pinned browser; launch/acceptance still fail on any
      # missing runtime dependency rather than skipping browser checks.
      - run: uv run --frozen python -m playwright install chromium
      - run: uv run --frozen python tests/browser_check.py
