[project]
name = "fil-match-intelligence"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.0", "playwright==1.55.0"]

[tool.uv]
package = false
required-version = "==0.12.23"

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.pytest.ini_options]
testpaths = ["tests"]
